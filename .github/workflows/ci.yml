name: CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Run Node Service Tests
        run: node scripts/run_tests.js

      - name: Run Python API & Engine Tests
        run: |
          python -m unittest tests.test_python_api -v
          python -m unittest tests.test_python_engine -v
          python -m unittest tests.test_marketing_site -v
