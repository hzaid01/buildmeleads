<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in · Lead Scout</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-page"><main class="auth-shell"><section class="auth-copy"><h1>Turn local discovery into careful outreach.</h1><p>Manage isolated lead data, personalized Groq drafts, and Gmail or SendGrid delivery from one account.</p></section><section class="auth-panel"><h2>Log in</h2><p>Continue to your lead workspace.</p><form id="authForm"><label>Email<input name="email" type="email" autocomplete="email" maxlength="254" required></label><label>Password<input name="password" type="password" autocomplete="current-password" minlength="10" maxlength="1024" required></label><div id="authError" class="auth-error hidden" role="alert"></div><button class="btn btn-primary btn-block" type="submit">Log in</button></form><p class="auth-switch">New here? <a href="/signup">Create an account</a></p></section></main><script src="auth.js"></script></body></html>
