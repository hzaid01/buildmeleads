<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · Lead Scout</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-page"><main class="auth-shell"><section class="auth-copy"><h1>Your leads belong to your account.</h1><p>The first administrator automatically claims the existing local lead database. Every later account starts with an isolated workspace.</p></section><section class="auth-panel"><h2>Create account</h2><p>Set up your private lead workspace.</p><form id="authForm"><label>Name<input name="display_name" autocomplete="name" maxlength="100"></label><label>Email<input name="email" type="email" autocomplete="email" maxlength="254" required></label><label>Password<input name="password" type="password" autocomplete="new-password" minlength="10" maxlength="1024" required aria-describedby="passwordHint"></label><small id="passwordHint">Use at least 10 characters.</small><div id="authError" class="auth-error hidden" role="alert"></div><button class="btn btn-primary btn-block" type="submit">Create account</button></form><p class="auth-switch">Already have an account? <a href="/login">Log in</a></p></section></main><script src="auth.js"></script></body></html>
